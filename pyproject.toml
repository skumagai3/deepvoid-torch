[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepvoid-torch"
version = "0.0.1"
description = "PyTorch implementation of DeepVoid, 3D U-Nets for cosmic web segmentation"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sam Kumagai" }]
dependencies = [
    "deepvoid @ git+https://github.com/skumagai3/deepvoid@5f9fe5f9df3c12b484ece7876202239c70eea415",
    "torch>=2.11",
]

[project.optional-dependencies]
convert = ["keras>=3"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NumPy 2 deprecation warnings raised inside Keras (used only by the converter tests)
filterwarnings = ["ignore::DeprecationWarning:keras.*"]
